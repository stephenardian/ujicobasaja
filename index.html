<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Ujian Online - Safe Exam Mode</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Container Sampul Depan */
    .cover-card {
      background: #ffffff;
      width: 90%;
      max-width: 750px;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      text-align: center;
      position: relative;
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge-safe {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #e3f2fd;
      color: #0d47a1;
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cover-card h1 {
      color: #1a237e;
      font-size: 28px;
      margin-bottom: 5px;
      font-weight: 700;
    }

    .cover-card p.subtitle {
      color: #5c6bc0;
      font-size: 15px;
      margin-top: 0;
      margin-bottom: 25px;
    }

    /* Grid Aturan & Informasi Ujian */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
      text-align: left;
    }

    .info-item {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      padding: 15px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .info-item i {
      font-size: 22px;
      color: #1e88e5;
    }

    .info-item .text-group {
      display: flex;
      flex-direction: column;
    }

    .info-item .title {
      font-size: 12px;
      color: #78909c;
      text-transform: uppercase;
      font-weight: 600;
    }

    .info-item .value {
      font-size: 14px;
      color: #263238;
      font-weight: 600;
    }

    /* Tombol Mulai */
    .btn-start {
      background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);
      color: white;
      border: none;
      padding: 14px 40px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(21, 101, 192, 0.3);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-start:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(21, 101, 192, 0.4);
      background: linear-gradient(135deg, #1565c0 0%, #0d47a1 100%);
    }

    /* Bar Peringatan Waktu & Layar Ujian */
    .warning-bar {
      background-color: #212529;
      color: white;
      padding: 10px 25px;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
    }

    .timer-box {
      background-color: #ffc107;
      color: #000;
      padding: 6px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
    }

    #examArea {
      display: none;
      width: 100%;
      height: 100vh;
      padding-top: 50px;
      box-sizing: border-box;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .system-msg {
      background: white;
      max-width: 600px;
      margin: 100px auto;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
    }
  </style>
</head>
<body>

<!-- SAMPUL HALAMAN DEPAN -->
<div id="startArea" class="cover-card">
  <div class="badge-safe">
    <i class="fa-solid fa-shield-halved"></i> Safe Exam Active
  </div>

  <h1>APLIKASI UJIAN ONLINE</h1>
  <p class="subtitle">(Google Forms + Countdown Timer)</p>

  <div class="info-grid">
    <div class="info-item">
      <i class="fa-solid fa-clock"></i>
      <div class="text-group">
        <span class="title">Waktu Ujian</span>
        <span class="value"><span id="examDurationText">120</span> Menit</span>
      </div>
    </div>

    <div class="info-item">
      <i class="fa-solid fa-expand"></i>
      <div class="text-group">
        <span class="title">Mode Layar</span>
        <span class="value">Wajib Fullscreen</span>
      </div>
    </div>

    <div class="info-item">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <div class="text-group">
        <span class="title">Toleransi Kabur</span>
        <span class="value">Maksimal 3 Kali</span>
      </div>
    </div>

    <div class="info-item">
      <i class="fa-solid fa-ban"></i>
      <div class="text-group">
        <span class="title">Akses Aplikasi</span>
        <span class="value">Terkuasai/Terkunci</span>
      </div>
    </div>
  </div>

  <button class="btn-start" onclick="startExam()">
    <i class="fa-solid fa-play"></i> Mulai Ujian Sekarang
  </button>
</div>

<!-- LAYAR UTAMA UJIAN -->
<div id="examArea">
  <div class="warning-bar">
    <span><i class="fa-solid fa-triangle-exclamation" style="color: #ff4d4d; margin-right: 5px;"></i> Sisa Kesempatan Tab: <strong id="violationCount" style="color: #ff4d4d;">3</strong></span>
    <div class="timer-box"><i class="fa-regular fa-clock"></i> Sisa Waktu: <span id="timerDisplay">00:00:00</span></div>
  </div>

  <!-- UBAH LINK GOOGLE FORM KAMU DI SINI -->
  <iframe id="gformIframe" src="https://docs.google.com/forms/d/e/1FAIpQLSdR4wFaQcD3Iur3RDbKkwvXoHrh5gUeUXu9L4jygDAV64Wn_w/viewform?embedded=true">
    Memuat Google Form...
  </iframe>
</div>

<script>
  // ATUR WAKTU UJIAN DI SINI (Dalam satuan Menit)
  const examDurationInMinutes = 120; 

  let violationsLeft = 3;
  let isExamActive = false;
  let totalSeconds = examDurationInMinutes * 60;
  let timerInterval;

  document.getElementById('examDurationText').innerText = examDurationInMinutes;

  // 1. Jalankan Mode Fullscreen, Timer, & Google Form
  function startExam() {
    const elem = document.documentElement;
    if (elem.requestFullscreen) {
      elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) {
      elem.webkitRequestFullscreen();
    }

    document.getElementById('startArea').style.display = 'none';
    document.getElementById('examArea').style.display = 'block';
    isExamActive = true;

    startTimer();
  }

  // 2. Fungsi Hitung Mundur Waktu
  function startTimer() {
    timerInterval = setInterval(function() {
      if (totalSeconds <= 0) {
        clearInterval(timerInterval);
        timeUp();
      } else {
        totalSeconds--;
        updateTimerDisplay();
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    const pad = (num) => String(num).padStart(2, '0');
    document.getElementById('timerDisplay').innerText = 
      `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
  }

  // 3. Waktu Habis
  function timeUp() {
    isExamActive = false;
    alert("Waktu pengerjaan ujian telah HABIS!");
    document.getElementById('examArea').innerHTML = `
      <div class="system-msg">
        <h2 style="color: #ffc107;"><i class="fa-solid fa-hourglass-end"></i> Waktu Telah Habis</h2>
        <p>Waktu pengerjaan ujian Anda sudah selesai.</p>
        <p>Pastikan Anda telah menekan tombol <strong>Kirim (Submit)</strong> pada Google Form sebelum meninggalkan halaman ini.</p>
      </div>
    `;
    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  }

  // 4. Sistem Penanganan Pelanggaran
  function handleViolation(reason) {
    if (!isExamActive) return;

    violationsLeft--;
    document.getElementById('violationCount').innerText = violationsLeft;

    if (violationsLeft > 0) {
      alert(`PERINGATAN! Anda terdeteksi ${reason}.\nSisa kesempatan: ${violationsLeft}`);
    } else {
      alert("Anda telah melebihi batas pelanggaran! Ujian dihentikan.");
      forceLock();
    }
  }

  // Deteksi Pindah Tab / Minimalize Browser (Tetap Aktif)
  document.addEventListener('visibilitychange', function() {
    if (document.hidden && isExamActive) {
      handleViolation("membuka tab baru atau meminimalisir browser");
    }
  });

  // Deteksi Keluar Fullscreen / Menekan Esc (Tetap Aktif)
  document.addEventListener('fullscreenchange', function() {
    if (!document.fullscreenElement && isExamActive) {
      handleViolation("keluar dari mode Fullscreen");
    }
  });

  // Matikan Klik Kanan, Copy, Paste, & Shortcut F12
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('copy', e => e.preventDefault());
  document.addEventListener('paste', e => e.preventDefault());
  document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || 
       (e.ctrlKey && e.shiftKey && e.key === 'I') || 
       (e.ctrlKey && e.key === 'u') || 
       (e.ctrlKey && e.key === 's')) {
      e.preventDefault();
    }
  });

  // Jika Pelanggaran Habis
  function forceLock() {
    clearInterval(timerInterval);
    isExamActive = false;
    document.getElementById('examArea').innerHTML = `
      <div class="system-msg">
        <h2 style="color: #dc3545;"><i class="fa-solid fa-user-slash"></i> Akses Ujian Dibatalkan</h2>
        <p>Anda telah dikeluarkan dari ujian karena terdeteksi berpindah tab/layar secara berulang kali.</p>
        <p>Silakan hubungi pengawas/guru ujian Anda.</p>
      </div>
    `;
    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  }
</script>

</body>
</html>
